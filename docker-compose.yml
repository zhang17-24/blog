# 服务器上只需要跑这个 —— 静态文件 + 自动 HTTPS
# 用法：docker compose up -d
#
# 站点地址在 .env 里配置（同目录）：
#   还没域名 → SITE_ADDRESS=:80        然后用 http://<服务器IP> 访问
#   有域名了 → SITE_ADDRESS=blog.example.com   自动申请 HTTPS 证书
#
# 改完 .env 后执行：docker compose up -d --force-recreate web

services:
  web:
    image: caddy:2-alpine
    container_name: blog
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3（纯 HTTP 模式下用不到，留着不影响）
    environment:
      # 默认 :80 —— 没配 .env 也能起来，用 IP 直接访问
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/blog:ro
      # 证书存在 caddy_data 里，这个卷千万不能删
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
